name: Generate metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Uses METRICS_TOKEN (a PAT with read:user, repo, read:org) when it is set,
      # which unlocks languages, private repos and org data. Falls back to the
      # automatic GITHUB_TOKEN, which can only see public activity on this repo.
      - name: Overview panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: RodrigoCorreia23
          filename: metrics.svg
          template: classic
          base: header, activity, community
          config_timezone: Europe/Lisbon
          plugin_languages: ${{ secrets.METRICS_TOKEN && 'yes' || 'no' }}
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_details: percentage
